<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>OpenClaw Command Surface</title>
<style>
:root{
  --bg:#0b1220;--panel:#111b2e;--panel2:#17243c;--text:#e5edf8;--muted:#93a4bf;--gold:#d4a84d;
  --green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--blue:#60a5fa;--purple:#a78bfa;--border:#22314f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#08101d,#0b1220 180px);color:var(--text);line-height:1.45}
.container{max-width:1240px;margin:0 auto;padding:20px}
a{color:var(--blue);text-decoration:none}
.header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}
.title h1{font-size:28px;color:var(--gold)}
.title p,.meta,.section-sub,.mini{color:var(--muted)}
.meta{text-align:right;font-size:13px}
.banner{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);padding:12px 14px;border-radius:12px;margin:16px 0;font-weight:700;color:#fecaca}
.awareness{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0 26px}
.strip-card,.section,.footer-focus,.detail-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px}
.strip-card h2,.section h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin-bottom:10px}
.strip-status{font-size:18px;font-weight:700;margin-bottom:10px}
.strip-list,.bullet-list{display:flex;flex-direction:column;gap:8px}
.strip-item,.bullet{background:var(--panel2);border:1px solid rgba(255,255,255,.04);padding:10px 12px;border-radius:12px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em}
.ok{background:rgba(34,197,94,.14);color:#86efac}.failed{background:rgba(239,68,68,.14);color:#fca5a5}.warn{background:rgba(245,158,11,.14);color:#fcd34d}.info{background:rgba(96,165,250,.14);color:#bfdbfe}.muted{background:rgba(148,163,184,.16);color:#cbd5e1}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.section{min-height:220px}
.section-header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}
.section-status{font-size:18px;font-weight:700}
.failure{margin:10px 0;padding:10px 12px;border-radius:12px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fecaca;font-weight:700}
.table{display:flex;flex-direction:column;gap:10px}
.table-item{background:var(--panel2);border:1px solid rgba(255,255,255,.04);padding:12px;border-radius:12px}
.table-item h3{font-size:15px;margin-bottom:6px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:13px;color:var(--muted);margin-top:8px}
.kv strong{color:var(--text);font-weight:600}
.decision{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07)}
.decision-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin-bottom:6px}
.decision-text{font-size:16px;font-weight:700}
.footer-focus{margin-top:18px;border:1px solid rgba(212,168,77,.35);background:linear-gradient(180deg,rgba(212,168,77,.08),rgba(17,27,46,1));}
.footer-focus h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin-bottom:12px}
.focus-line{padding:10px 12px;background:rgba(255,255,255,.03);border-radius:12px;margin-bottom:8px;font-size:15px;font-weight:700}
.details{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0 28px}
details{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px}
summary{cursor:pointer;font-weight:700;color:var(--gold)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:rgba(255,255,255,.06);padding:2px 6px;border-radius:6px}
pre{white-space:pre-wrap;color:var(--muted);font-size:12px;margin-top:10px}
.no-data{color:var(--muted);font-style:italic}
@media (max-width:960px){.awareness,.grid,.details{grid-template-columns:1fr}.meta{text-align:left}.header{flex-direction:column}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title">
      <h1>⚡ OpenClaw Command Surface</h1>
      <p>Weekly decision pressure for H1 revenue, H2 proof, and system stability.</p>
    </div>
    <div class="meta" id="meta">Loading…</div>
  </div>

  <div id="failure-banner"></div>

  <div class="awareness">
    <section class="strip-card" id="awareness-health"></section>
    <section class="strip-card" id="awareness-schedule"></section>
    <section class="strip-card" id="awareness-interrupts"></section>
  </div>

  <div class="grid">
    <section class="section" id="section-h1"></section>
    <section class="section" id="section-enforcer"></section>
    <section class="section" id="section-proof"></section>
    <section class="section" id="section-objections"></section>
    <section class="section" id="section-system"></section>
    <section class="section" id="section-stop"></section>
  </div>

  <section class="footer-focus" id="focus-footer"></section>

  <div class="details">
    <details open>
      <summary>Exact sources used</summary>
      <div id="sources"></div>
    </details>
    <details open>
      <summary>System gaps / conflicts</summary>
      <div id="gaps"></div>
    </details>
    <details>
      <summary>Implementation plan</summary>
      <div id="plan"></div>
    </details>
    <details>
      <summary>Decision hash method</summary>
      <div id="hash"></div>
    </details>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const badgeClass = (value='') => {
  const v = value.toLowerCase();
  if (['ok','healthy','normal','all systems normal','complete'].some(x => v.includes(x))) return 'badge ok';
  if (['failed','failure','interrupt','incomplete','stale'].some(x => v.includes(x))) return 'badge failed';
  if (['spike','warning','attention','uncertain'].some(x => v.includes(x))) return 'badge warn';
  if (['no change','no signal','no active', 'missing', 'incomplete'].some(x => v.includes(x))) return 'badge muted';
  return 'badge info';
};
const esc = (s='') => String(s)
  .replaceAll('&','&amp;')
  .replaceAll('<','&lt;')
  .replaceAll('>','&gt;');

function renderAwarenessCard(target, title, status, items, formatter){
  const body = (items && items.length)
    ? items.map(item => formatter(item)).join('')
    : '<div class="no-data">No qualifying items.</div>';
  target.innerHTML = `
    <h2>${esc(title)}</h2>
    <div class="strip-status">${esc(status || '—')}</div>
    <div class="strip-list">${body}</div>
  `;
}

function renderSection(target, title, section, renderer){
  const items = section.items || [];
  const body = items.length ? renderer(items) : `<div class="no-data">${esc(section.status || 'No data')}</div>`;
  target.innerHTML = `
    <div class="section-header">
      <div>
        <h2>${esc(title)}</h2>
        <div class="section-status">${esc(section.status || '—')}</div>
      </div>
      <span class="${badgeClass(section.status)}">${esc(section.status || '—')}</span>
    </div>
    ${section.failure ? `<div class="failure">${esc(section.failure)}</div>` : ''}
    ${body}
    <div class="decision">
      <div class="decision-label">Decision</div>
      <div class="decision-text">${esc(section.decision || '—')}</div>
    </div>
  `;
}

function listBlock(items, formatter){
  return `<div class="table">${items.map(item => `<div class="table-item">${formatter(item)}</div>`).join('')}</div>`;
}

function renderSources(sources){
  const keys = Object.keys(sources || {});
  if (!keys.length) return '<div class="no-data">No source metadata.</div>';
  return keys.map(key => {
    const items = sources[key] || [];
    return `<div class="table-item" style="margin-top:10px"><h3>${esc(key)}</h3>${items.length ? items.map(it => `<div class="mini">• ${esc(it.label)} — <code>${esc(it.path)}</code></div>`).join('') : '<div class="no-data">None</div>'}</div>`;
  }).join('');
}

fetch('data.json', {cache:'no-store'})
  .then(r => r.json())
  .then(data => {
    const meta = data.meta || {};
    $('meta').innerHTML = `Generated <strong>${esc(meta.generated_local || '—')}</strong><br>Decision hash <code>${esc((meta.decision_hash || {}).value || '—')}</code><br>${esc(meta.change_summary || '—')} · ${meta.publish_recommended ? 'publish recommended' : 'local only'}`;

    const h1 = data.sections?.h1_revenue_engine || {};
    if (h1.failure) $('failure-banner').innerHTML = `<div class="banner">${esc(h1.failure)}</div>`;

    renderAwarenessCard($('awareness-health'), 'System health snapshot', data.awareness?.system_health?.status, data.awareness?.system_health?.items, item => `
      <div class="strip-item">
        <div class="row"><strong>${esc(item.label)}</strong><span class="${badgeClass(item.status)}">${esc(item.status)}</span></div>
        <div class="mini">${esc(item.detail || '')}</div>
      </div>`);

    renderAwarenessCard($('awareness-schedule'), 'Upcoming schedule (72h)', data.awareness?.upcoming_schedule?.status, data.awareness?.upcoming_schedule?.items, item => `
      <div class="strip-item">
        <div class="row"><strong>${esc(item.label)}</strong><span class="mini">${esc(item.when || '')}</span></div>
        <div class="mini">${esc(item.detail || item.kind || '')}</div>
      </div>`);

    renderAwarenessCard($('awareness-interrupts'), 'Interrupts', data.awareness?.interrupts?.status, (data.awareness?.interrupts?.items || []).map(text => ({text})), item => `
      <div class="strip-item"><strong>${esc(item.text)}</strong></div>`);

    renderSection($('section-h1'), 'H1 Revenue Engine', h1, items => listBlock(items, item => `
      <h3>${esc(item.name)}</h3>
      <div class="row"><span class="${badgeClass(item.classification)}">${esc(item.classification)}</span><span class="mini">${esc(item.last_movement)}</span></div>
      <div class="kv">
        <div>Stage<br><strong>${esc(item.stage)}</strong></div>
        <div>Days in stage<br><strong>${esc(item.days_in_stage ?? '—')}</strong></div>
        <div>Next action<br><strong>${esc(item.next_action)}</strong></div>
        <div>Stall reason<br><strong>${esc(item.stall_reason)}</strong></div>
      </div>
      ${item.conflict ? '<div class="failure" style="margin-top:10px">STALE OR UNCERTAIN DATA</div>' : ''}`));

    renderSection($('section-enforcer'), 'Execution Enforcer', data.sections?.execution_enforcer || {}, items => {
      const section = data.sections?.execution_enforcer || {};
      const mv = section.move_verification || {};
      return listBlock([{...section, ...mv}], item => `
        <h3>${esc(section.current_move || 'ENFORCER DATA MISSING')}</h3>
        <div class="row"><span class="${badgeClass(String(section.score ?? 'missing'))}">Score: ${esc(section.score ?? '—')}</span><span class="${badgeClass(section.blocked ? 'failed' : 'ok')}">${section.blocked ? 'BLOCKED' : (section.carry_forward ? 'carry-forward' : 'active')}</span></div>
        <div class="kv">
          <div>Executed<br><strong>${esc(String(item.executed))}</strong></div>
          <div>Buyer-visible<br><strong>${esc(String(item.buyer_visible))}</strong></div>
          <div>Artifact<br><strong>${esc(item.artifact || '—')}</strong></div>
          <div>Opportunity<br><strong>${esc(item.opportunity_id || '—')}</strong></div>
        </div>
        <div class="mini" style="margin-top:10px">Gate failures: ${section.gate_failures?.length ? esc(section.gate_failures.join(' · ')) : 'none logged'}</div>`);
    });

    renderSection($('section-proof'), 'Proof / Moat', data.sections?.proof_moat || {}, items => listBlock(items, item => `
      <div class="row"><h3>${esc(item.type)} · ${esc(item.component)}</h3><span class="mini">${esc(item.stage || '')}</span></div>
      <div>${esc(item.text)}</div>
      <div class="mini" style="margin-top:8px">Source: ${esc(item.source || '—')} · opportunity: ${esc(item.opportunity_id || '—')}</div>`));

    renderSection($('section-objections'), 'Objection Intelligence', data.sections?.objection_intelligence || {}, items => listBlock(items, item => `
      <h3>${esc(item.name || item.opportunity_id || 'Opportunity')}</h3>
      <div>${esc(item.phrasing)}</div>
      <div class="mini" style="margin-top:8px">Stage: ${esc(item.stage || '—')} · opportunity: ${esc(item.opportunity_id || '—')}</div>`));

    renderSection($('section-system'), 'System Health (Decision)', data.sections?.system_health || {}, items => {
      const section = data.sections?.system_health || {};
      const failures = section.failures || [];
      return listBlock([{failures}], () => `
        <div class="kv">
          <div>Monthly burn<br><strong>${esc(section.monthly_burn || 'Unknown')}</strong></div>
          <div>Cost drift<br><strong>${esc(section.cost_drift || 'Unknown')}</strong></div>
          <div>Current phase<br><strong>${esc(section.phase_gate?.current_phase || '—')}</strong></div>
          <div>Candidate next phase<br><strong>${esc(section.phase_gate?.candidate_next_phase || '—')}</strong></div>
        </div>
        <div class="bullet-list" style="margin-top:12px">${failures.map(f => `<div class="bullet"><div class="row"><strong>${esc(f.label)}</strong><span class="${badgeClass(f.status)}">${esc(f.status)}</span></div></div>`).join('')}</div>`);
    });

    renderSection($('section-stop'), 'Stop Doing', data.sections?.stop_doing || {}, items => listBlock(items, item => `
      <h3>${esc(item.name)}</h3>
      <div>${esc(item.reason)}</div>`));

    const focus = data.focus_collapse || {};
    $('focus-footer').innerHTML = `
      <h2>Focus Collapse</h2>
      <div class="focus-line">H1: ${esc(focus.h1_move || '—')}</div>
      <div class="focus-line">H2: ${esc(focus.h2_emphasis || '—')}</div>
      <div class="focus-line">Constraint: ${esc(focus.system_constraint || '—')}</div>`;

    $('sources').innerHTML = renderSources(data.exact_sources_used);
    $('gaps').innerHTML = (data.system_gaps_conflicts || []).length
      ? (data.system_gaps_conflicts || []).map(item => `<div class="table-item" style="margin-top:10px">${esc(item)}</div>`).join('')
      : '<div class="no-data">No active gaps logged.</div>';
    $('plan').innerHTML = (data.implementation_plan || []).map(item => `<div class="table-item" style="margin-top:10px">${esc(item)}</div>`).join('');
    $('hash').innerHTML = `<pre>${esc(JSON.stringify(data.meta?.decision_hash || {}, null, 2))}</pre><div class="mini" style="margin-top:10px">${esc(data.decision_hash_method || '')}</div>`;
  })
  .catch(err => {
    $('meta').textContent = 'Failed to load data.json';
    console.error(err);
  });
</script>
</body>
</html>
